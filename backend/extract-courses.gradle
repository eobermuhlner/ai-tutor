// Gradle task to extract course files from resources to external directory
// Run with: ./gradlew :backend:extractCourseFiles

task extractCourseFiles {
    group = 'migration'
    description = 'Extract course-content files from resources to external directory for API upload'

    doLast {
        def sourceDir = file('src/main/resources/course-content')
        def targetDir = file('../../course-content-extracted')

        println "Extracting course files..."
        println "Source: ${sourceDir.absolutePath}"
        println "Target: ${targetDir.absolutePath}"

        if (!sourceDir.exists()) {
            throw new GradleException("Source directory does not exist: ${sourceDir.absolutePath}")
        }

        // Create target directory
        targetDir.mkdirs()

        // Copy all course directories
        def courseCount = 0
        def lessonCount = 0

        sourceDir.eachDir { courseDir ->
            def targetCourseDir = new File(targetDir, courseDir.name)
            targetCourseDir.mkdirs()

            println "\nProcessing course: ${courseDir.name}"

            // Copy curriculum.yml
            def curriculumFile = new File(courseDir, 'curriculum.yml')
            if (curriculumFile.exists()) {
                copy {
                    from curriculumFile
                    into targetCourseDir
                }
                println "  ✓ curriculum.yml"
            } else {
                println "  ✗ curriculum.yml NOT FOUND"
            }

            // Copy all .md lesson files
            courseDir.eachFileMatch(~/.*\.md$/) { lessonFile ->
                copy {
                    from lessonFile
                    into targetCourseDir
                }
                println "  ✓ ${lessonFile.name}"
                lessonCount++
            }

            courseCount++
        }

        println "\n" + "=".repeat(60)
        println "Extraction complete!"
        println "Courses extracted: ${courseCount}"
        println "Lessons extracted: ${lessonCount}"
        println "Target directory: ${targetDir.absolutePath}"
        println "=".repeat(60)
        println "\nYou can now upload these files via:"
        println "  1. Course Management UI: Click 'Import Course' button"
        println "  2. REST API: POST /api/v1/courses/import/file"
    }
}
