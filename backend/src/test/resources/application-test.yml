jwt:
  secret: test-secret-for-testing

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Provide dummy AI configuration to prevent initialization errors
  ai:
    openai:
      api-key: test-key
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-4o
      audio:
        speech:
          options:
            model: tts-1
    azure:
      openai:
        api-key: test-key
        endpoint: https://test.openai.azure.com
        chat:
          options:
            deployment-name: gpt-4o
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama2
    model:
      audio:
        speech: none  # Disable TTS in tests

ai-tutor:
  catalog:
    use-seeding: false  # Disable seeding in tests to prevent conflicts
  audio:
    enabled: false  # Disable audio in tests

logging:
  level:
    org.springframework: WARN
    ch.obermuhlner: INFO
