spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aitutor}
    username: ${SPRING_DATASOURCE_USERNAME:aitutor_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aitutor_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: postgres-hikari-pool
      data-source-properties:
        currentSchema: public

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        globally_quoted_identifiers: false
        jdbc:
          time_zone: UTC
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        connection:
          charSet: UTF-8
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    # Allow Flyway to work with newer PostgreSQL versions
    validate-on-migrate: false