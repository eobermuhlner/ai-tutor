# Production Management/Actuator Configuration
# Separate management port for internal monitoring (should NOT be exposed to internet)
management:
  server:
    port: 9090  # Internal port for Prometheus scraping
  endpoint:
    health:
      show-details: never  # Don't expose internal details in production
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

cors:
  # Prefer exact origins; if you truly need subdomains, use allowed-origin-patterns
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allow-credentials: true     # only if you use cookie/session auth
  exposed-headers:
    - X-Total-Count            # example; keep this list tight or empty
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    - X-RateLimit-Reset
    - X-RateLimit-Limit-Hour
    - X-RateLimit-Remaining-Hour
    - X-RateLimit-Reset-Hour
    - X-RateLimit-Limit-Day
    - X-RateLimit-Remaining-Day
    - X-RateLimit-Reset-Day

logging:
  level:
    root: WARN
    ch.obermuhlner.aitutor: INFO
    org.apache.tomcat.util.http.parser.Cookie: WARN
