cors:
  # Prefer exact origins; if you truly need subdomains, use allowed-origin-patterns
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allow-credentials: true     # only if you use cookie/session auth
  exposed-headers:
    - X-Total-Count            # example; keep this list tight or empty
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    - X-RateLimit-Reset
    - X-RateLimit-Limit-Hour
    - X-RateLimit-Remaining-Hour
    - X-RateLimit-Reset-Hour
    - X-RateLimit-Limit-Day
    - X-RateLimit-Remaining-Day
    - X-RateLimit-Reset-Day
