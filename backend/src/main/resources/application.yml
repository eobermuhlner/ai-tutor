        displayOrder: 0
      - languageCode: mul-ipa
        nameEnglish: Conversational IPA
        shortDescriptionEnglish: Learn to read IPA through practical pronunciation practice
        descriptionEnglish: Practical approach to reading IPA transcriptions focusing on common sounds in European languages and real-world dictionary entries
        category: Conversational
