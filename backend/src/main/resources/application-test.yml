jwt:
  secret: test-secret-for-testing

ai-tutor:
  audio:
    enabled: false  # Disable audio in tests

  catalog:
    use-seeding: false  # Disables both SeedDataService and SeedLanguageService

  rate-limits:
    free:
      messages-per-hour: 10
      messages-per-day: 50
    free-byok:
      messages-per-hour: 60
      messages-per-day: 300
    premium:
      messages-per-hour: 100
      messages-per-day: 500

logging:
  level:
    org.springframework: WARN
    ch.obermuhlner: INFO
