courses:
  # Spanish (Spain) courses
  - languageCode: es-ES
    name:
      en: Conversational Spanish
    shortDescription:
      en: Master everyday conversations at your own pace
    description:
      en: Learn to communicate naturally in Spanish through practical conversations covering greetings, daily routines, opinions, and more
    category: Conversational
    targetAudience:
      en: Anyone wanting to speak Spanish naturally
    startingLevel: None
    targetLevel: C1
