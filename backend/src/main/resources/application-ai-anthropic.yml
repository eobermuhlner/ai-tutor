# Anthropic (Claude) - requires ANTHROPIC_API_KEY environment variable

spring.ai.model.chat: anthropic
spring.ai.model.embedding: none
spring.ai.model.embedding.text: none
spring.ai.model.embedding.multimodal: none
spring.ai.model.image: none
spring.ai.model.moderation: none
spring.ai.model.audio.speech: none
spring.ai.model.audio.transcription: none

spring.ai.anthropic.chat.options.model: claude-3-5-sonnet-20241022
spring.ai.anthropic.api-key: ${ANTHROPIC_API_KEY}  # Optional: override env var
spring.ai.anthropic.base-url: https://api.anthropic.com  # Optional: custom endpoint

# Disable audio features for Anthropic (no native TTS support)
ai-tutor:
  audio:
    enabled: false
