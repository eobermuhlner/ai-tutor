services:
  db:
    image: postgres:16-alpine
    container_name: ai-tutor-postgres
    environment:
      - POSTGRES_DB=aitutor
      - POSTGRES_USER=aitutor_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aitutor_password}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/postgres-init-scripts:/docker-entrypoint-initdb.d:ro  # For initialization scripts
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitutor_user -d aitutor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-tutor-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-tutor-backend
    user: "1000:1000"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=dev-openai-postgres

      # Database Configuration
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/aitutor
      - SPRING_DATASOURCE_USERNAME=aitutor_user
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-aitutor_password}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

      # OpenAI Configuration (default provider)
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Alternative: Azure OpenAI (uncomment to use)
      # - SPRING_PROFILES_ACTIVE=dev-azure-openai
      # - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      # - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}

      # Alternative: Ollama (uncomment to use)
      # - SPRING_PROFILES_ACTIVE=dev-ollama
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434

      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET:-default-secret-key-change-in-production}

      # Google OAuth Configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # Admin User
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminadmin}

      # Demo User
      - DEMO_USERNAME=${DEMO_USERNAME:-demo}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-demo}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-tutor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:${BACKEND_PORT:-8080}/api/v1
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: ai-tutor-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ai-tutor-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-tutor-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-tutor-network

  grafana:
    image: grafana/grafana:latest
    container_name: ai-tutor-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3000}
      - GF_INSTALL_PLUGINS=
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ai-tutor-network

networks:
  ai-tutor-network:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:

# Usage:
#
# 1. Create a .env file in the project root with your configuration:
#    OPENAI_API_KEY=your-api-key
#    JWT_SECRET=your-secret-key
#    POSTGRES_PASSWORD=your-postgres-password  # Required when using PostgreSQL
#
# 2. Start all services:
#    docker-compose up
#
# 3. Start in detached mode:
#    docker-compose up -d
#
# 4. View logs:
#    docker-compose logs -f
#
# 5. Stop all services:
#    docker-compose down
#
# 6. Rebuild after code changes:
#    docker-compose up --build
#
# 7. Stop and remove volumes:
#    docker-compose down -v
#
# Data Management:
# PostgreSQL data is stored in a named volume (postgres-data) for proper container isolation.
# If you need to access/export PostgreSQL data to the ./data directory:
#    docker exec ai-tutor-postgres pg_dump -U aitutor_user aitutor > ./data/postgres-dump.sql
#
# To restore data from a dump file:
#    docker exec -i ai-tutor-postgres psql -U aitutor_user -d aitutor < ./data/postgres-dump.sql
#
# Access (default ports, customizable via .env):
# - Frontend: http://localhost:5173 (FRONTEND_PORT)
# - Backend API: http://localhost:8080 (BACKEND_PORT)
# - PostgreSQL: localhost:5432 (POSTGRES_PORT) - when using PostgreSQL profile
# - H2 Console: http://localhost:8080/h2-console - when using H2 profile
# - API Docs: http://localhost:8080/swagger-ui.html
# - Prometheus: http://localhost:9090 (PROMETHEUS_PORT)
# - Grafana: http://localhost:3000 (GRAFANA_PORT, admin/admin)
