plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'application'
}

group = 'ch.obermuhlner'
version = '0.0.1-SNAPSHOT'
description = 'AI Tutor Test Harness'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Depend on backend module for DTOs and domain models
    implementation project(':backend')

    // Core dependencies
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.4.8'

    // Test dependencies
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'io.mockk:mockk:1.13.8'
    testImplementation 'com.ninja-squad:springmockk:4.0.2'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ch.obermuhlner.aitutor.testharness.TestHarnessMain'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Task for running the test harness
task runTestHarness(type: JavaExec) {
    group = 'application'
    description = 'Run the pedagogical test harness'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ch.obermuhlner.aitutor.testharness.TestHarnessMain'

    // Pass through command-line arguments
    if (project.hasProperty('args')) {
        args = project.property('args').split()
    }

    // Ensure OPENAI_API_KEY is available
    environment 'OPENAI_API_KEY', System.getenv('OPENAI_API_KEY')
    environment 'TESTHARNESS_JUDGE_API_KEY', System.getenv('TESTHARNESS_JUDGE_API_KEY')
    environment 'TESTHARNESS_JUDGE_API_ENDPOINT', System.getenv('TESTHARNESS_JUDGE_API_ENDPOINT')
    environment 'TESTHARNESS_JUDGE_DEPLOYMENT_NAME', System.getenv('TESTHARNESS_JUDGE_DEPLOYMENT_NAME')
}