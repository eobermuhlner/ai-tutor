// Root project build configuration for AI Tutor multi-module project

plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.25' apply false
    id 'org.springframework.boot' version '3.5.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'jacoco'
}

// Group and version for all modules
group = 'ch.obermuhlner'
version = '0.0.1-SNAPSHOT'

// Global configuration for all subprojects
subprojects {
    repositories {
        mavenCentral()
    }
}
