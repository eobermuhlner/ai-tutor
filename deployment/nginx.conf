events {
    worker_connections 1024;
}

http {
    upstream aitutor_prod_backend {
        server 127.0.0.1:5000;
    }

    upstream aitutor_prod_frontend {
        server 127.0.0.1:5001;
    }

    upstream aitutor_test_backend {
        server 127.0.0.1:5100;
    }

    upstream aitutor_test_frontend {
        server 127.0.0.1:5101;
    }

    upstream aitutor_prod_grafana {
        server 127.0.0.1:3001;
    }

    upstream aitutor_test_grafana {
        server 127.0.0.1:3101;
    }

    # SSL Configuration
    #use default instead of: ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    ####### ai-tutor PROD

    server {
        listen 80;
        server_name ai-tutor.obermuhlner.ch;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name ai-tutor.obermuhlner.ch;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # SSL Certificate
        ssl_certificate /etc/letsencrypt/live/ai-tutor.obermuhlner.ch/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ai-tutor.obermuhlner.ch/privkey.pem;

        # OAuth2 endpoints - must proxy to backend
        location /oauth2 {
          proxy_pass http://aitutor_prod_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /login/oauth2 {
            proxy_pass http://aitutor_prod_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API requests - Proxy to backend
        location /api/v1 {
            proxy_pass http://aitutor_prod_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Grafana - Monitoring dashboards (requires authentication)
        # Redirect /grafana to /grafana/
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://aitutor_prod_grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for live updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Buffering settings
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Frontend - Serve static files and handle SPA routing
        location / {
            proxy_pass http://aitutor_prod_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Security - Deny access to sensitive files
        location ~ /\. {
            deny all;
        }
    }

    ###### ai-tutor TEST

