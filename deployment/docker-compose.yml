services:
  backend:
    image: ghcr.io/${GITHUB_USERNAME:-your-username}/ai-tutor-backend:${IMAGE_TAG}
    container_name: ai-tutor-backend-${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
      - "9090:9090"  # Management port for Prometheus (internal network only)
    user: "${UID}:${GID}"
    environment:
      - UID=${UID}
      - GUI=${GID}
      # Spring Profile - set to production for production deployment
      - SPRING_PROFILES_ACTIVE=prod

      # Required: OpenAI Configuration (or other AI provider configuration)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Alternative: Azure OpenAI (uncomment to use)
      # - SPRING_PROFILES_ACTIVE=prod-azure-openai
      # - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      # - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}

      # JWT Configuration - CRITICAL: Change this in production!
      - JWT_SECRET=${JWT_SECRET}

      # Google OAuth Configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # Admin User Configuration
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

      # Demo User Configuration
      - DEMO_USERNAME=${DEMO_USERNAME:-demo}
      - DEMO_PASSWORD=${DEMO_PASSWORD}

      # CORS Configuration for production
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-https://ai-tutor.obermuhlner.ch}
    volumes:
      # Persistent data storage
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    networks:
      - ai-tutor-network
  #    depends_on:
  #      - db

  frontend:
    image: ghcr.io/${GITHUB_USERNAME:-your-username}/ai-tutor-frontend:${IMAGE_TAG}
    container_name: ai-tutor-frontend-${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - ai-tutor-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-tutor-prometheus-${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"  # Map to different host port to avoid conflicts
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-tutor-network

  grafana:
    image: grafana/grafana:latest
    container_name: ai-tutor-grafana-${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"  # Internal port for nginx proxy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-ai-tutor.obermuhlner.ch}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://ai-tutor.obermuhlner.ch/grafana}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ENFORCE_DOMAIN=false
      - GF_SERVER_PROTOCOL=http
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=info
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    user: "${UID}:${GID}"
    depends_on:
      - prometheus
    networks:
      - ai-tutor-network

networks:
  ai-tutor-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: