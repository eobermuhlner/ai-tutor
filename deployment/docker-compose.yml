services:
  backend:
    image: ghcr.io/${GITHUB_USERNAME:-your-username}/ai-tutor-backend:${IMAGE_TAG}
    container_name: ai-tutor-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    user: "${UID}:${GID}"
    environment:
      - UID=${UID}
      - GUI=${GID}
      # Spring Profile - set to production for production deployment
      - SPRING_PROFILES_ACTIVE=prod

      # Required: OpenAI Configuration (or other AI provider configuration)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Alternative: Azure OpenAI (uncomment to use)
      # - SPRING_PROFILES_ACTIVE=prod-azure-openai
      # - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      # - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}

      # JWT Configuration - CRITICAL: Change this in production!
      - JWT_SECRET=${JWT_SECRET}

      # Google OAuth Configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # Admin User Configuration
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

      # Demo User Configuration
      - DEMO_USERNAME=${DEMO_USERNAME:-demo}
      - DEMO_PASSWORD=${DEMO_PASSWORD}

      # CORS Configuration for production
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-https://ai-tutor.obermuhlner.ch}
    volumes:
      # Persistent data storage
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    networks:
      - ai-tutor-network
  #    depends_on:
  #      - db

  frontend:
    image: ghcr.io/${GITHUB_USERNAME:-your-username}/ai-tutor-frontend:${IMAGE_TAG}
    container_name: ai-tutor-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - ai-tutor-network

