name: Deploy to Production

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-tutor-backend
  FRONTEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-tutor-frontend

jobs:
  deploy-prod:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images for production
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.BACKEND_IMAGE_NAME }}:prod-${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.release.tag_name }}

      - name: Build and push frontend Docker image for production
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.FRONTEND_IMAGE_NAME }}:prod-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.release.tag_name }}
            VITE_API_URL=https://ai-tutor.obermuhlner.ch/api/v1
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Create/update prod directory
            mkdir -p ~/prod
            cd ~/prod

            # Always download latest deployment files to ensure configuration is up-to-date
            curl -s -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/master/deployment/docker-compose.yml
            curl -s -o nginx.conf https://raw.githubusercontent.com/${{ github.repository }}/master/deployment/nginx.conf
            curl -s -o prometheus.yml https://raw.githubusercontent.com/${{ github.repository }}/master/deployment/prometheus.yml

            # Download Grafana provisioning files
            mkdir -p grafana/provisioning/dashboards
            mkdir -p grafana/provisioning/datasources
            curl -s -o grafana/provisioning/dashboards/dashboard.yml https://raw.githubusercontent.com/${{ github.repository }}/master/grafana/provisioning/dashboards/dashboard.yml
            curl -s -o grafana/provisioning/dashboards/ai-tutor-dashboard.json https://raw.githubusercontent.com/${{ github.repository }}/master/grafana/provisioning/dashboards/ai-tutor-dashboard.json
            curl -s -o grafana/provisioning/dashboards/spring-jvm-dashboard.json https://raw.githubusercontent.com/${{ github.repository }}/master/grafana/provisioning/dashboards/spring-jvm-dashboard.json
            curl -s -o grafana/provisioning/datasources/prometheus.yml https://raw.githubusercontent.com/${{ github.repository }}/master/grafana/provisioning/datasources/prometheus.yml

            # Create .env file for production environment
            cat > .env << 'EOL'
            GITHUB_USERNAME=${{ github.repository_owner }}
            IMAGE_TAG=latest
            UID=1000
            GID=1000
            BACKEND_PORT=5000
            FRONTEND_PORT=5001
            MANAGEMENT_PORT=9090
            GRAFANA_PORT=3001
            PROMETHEUS_PORT=9091
            BACKEND_URL=http://localhost:5000/api/v1
            FRONTEND_URL=https://ai-tutor.obermuhlner.ch
            GRAFANA_DOMAIN=ai-tutor.obermuhlner.ch
            GRAFANA_ROOT_URL=https://ai-tutor.obermuhlner.ch/grafana
            JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            DEMO_USERNAME=${{ secrets.DEMO_USERNAME }}
            DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_PROD }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            EOL
            
            # Update nginx configuration
            echo "Updating nginx configuration..."
            sudo cp ~/prod/nginx.conf /etc/nginx/nginx.conf
            sudo nginx -t
            if [ $? -eq 0 ]; then
              sudo nginx -s reload
              echo "Nginx configuration updated successfully"
            else
              echo "Nginx configuration test failed"
              exit 1
            fi

            # Pull and start containers
            docker compose pull
            docker compose up -d --force-recreate

            # Wait for services to be healthy
            sleep 30

            # Check if services are running
            if docker compose ps | grep -E "(backend|frontend).*healthy"; then
              echo "Production deployment successful!"
            else
              echo "Some services are not healthy"
              docker compose ps
              exit 1
            fi